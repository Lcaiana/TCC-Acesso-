<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/escolhaLogin.css">
    <title>Acesso+</title>
</head>
<body>

    <header>
        <a href="index.html" class="logo-card"><img src="img/logo.png" alt="Logo Acesso+ e Voltar para tela inicial" ></a>
    </header>

    <main>
        <h1>Como você deseja acessar?</h1>
        <div class="cards">
            <a href="loginUser.html" class="card-link">
                <div class="card-content">
                    <img src="img/pcd.png" alt="Imagem PCD" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">Beneficiário / PCD</h3>
                        <p class="card-description">Acesse sua carteirinha, agendamentos e rede acessível.</p>
                    </div>
                </div>
            </a>

            <a href="loginProfissional.html" class="card-link">
                <div class="card-content">
                    <img src="img/medico.png" alt="Imagem Médico" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">Profissionais de Saúde</h3>
                        <p class="card-description">Área exclusiva para médicos, terapeutas e especialistas.</p>
                    </div>
                </div>
            </a>

            <a href="#" class="card-link">
                <div class="card-content">
                    <img src="img/engrenagem-do-administrador.png" alt="Imagem Administrador" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">Administrador</h3>
                        <p class="card-description">Gestão interna do sistema, relatórios e controle de acessos.</p>
                    </div>
                </div>
            </a>

        </div>
    </main>
    <script src="js/escolhaLogin.js"></script>
</body>
</html>
