<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/escolhaLogin.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <title>Acesso+</title>
</head>
<body>

    <div class="acessibilidade-botoes acessibilidade-flutuante" aria-label="Controles de acessibilidade">
        <button type="button" id="btn-leitor-voz" onclick="ligarLeitorVoz()" title="Leitor de Tela" class="btn-acessibilidade">🔊 Ouvir</button>
        <button type="button" onclick="mudarFonte(1)" title="Aumentar Texto" class="btn-acessibilidade">A+</button>
        <button type="button" onclick="mudarFonte(-1)" title="Diminuir Texto" class="btn-acessibilidade">A-</button>
        <button type="button" onclick="alternarContraste()" title="Modo Escuro/Alto Contraste" class="btn-acessibilidade icone">◐</button>
    </div>

    <header>
        <a href="index.html" class="logo-card"><img src="img/logo.png" alt="Logo Acesso+ e Voltar para tela inicial" ></a>
    </header>

    <main>
        <h1>Como você deseja acessar?</h1>
        <div class="cards">
            <a href="loginUser.html" class="card-link">
                <div class="card-content">
                    <img src="img/pcd.png" alt="Imagem PCD" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">Beneficiário / PCD</h3>
                        <p class="card-description">Acesse sua carteirinha, agendamentos e rede acessível.</p>
                    </div>
                </div>
            </a>

            <a href="loginProfissional.html" class="card-link">
                <div class="card-content">
                    <img src="img/medico.png" alt="Imagem Médico" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">Profissionais de Saúde</h3>
                        <p class="card-description">Área exclusiva para médicos, terapeutas e especialistas.</p>
                    </div>
                </div>
            </a>

            <a href="#" class="card-link">
                <div class="card-content">
                    <img src="img/engrenagem-do-administrador.png" alt="Imagem Administrador" class="card-img">
                    <div class="card-body">
                        <h3 class="card-title">Administrador</h3>
                        <p class="card-description">Gestão interna do sistema, relatórios e controle de acessos.</p>
                    </div>
                </div>
            </a>

        </div>
    </main>

    <!-- Widget oficial VLibras (Tradução em Libras - Gov.br) -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <script src="js/escolhaLogin.js"></script>
    <script src="js/acessibilidade.js"></script>
</body>
</html>
